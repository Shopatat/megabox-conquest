<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Conquest</title>
<meta name="description" content="Space Conquest, remake de Megabox Conquest, le jeu des Sagem myX (2001) : conquiers l’espace sans te faire toucher.">
<meta name="theme-color" content="#070916">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Space Conquest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Interface : arcade moderne. Verre dépoli, coins arrondis, dégradés néon ; police pixel pour les titres et les chiffres */
:root{
  --bg:#070916; --text:#f2f3ff; --muted:#8f95c6;
  --panel:rgba(24,28,62,.66); --line:rgba(170,178,255,.13); --line-2:rgba(170,178,255,.24);
  --accent:#ff5c8a; --accent-2:#ff9a4d; --cyan:#43e0ff; --violet:#8c6bff; --ball:#ffd23f;
  --grad:linear-gradient(135deg,#ff5c8a 0%,#ff9a4d 100%);
  --grad-cool:linear-gradient(90deg,#43e0ff 0%,#8c6bff 100%);
  --display:"Exo 2","Trebuchet MS",sans-serif;
  --title:"Orbitron","Exo 2","Trebuchet MS",sans-serif;
  --body:"Rubik",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.9,.3,1.15);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;
  background:radial-gradient(120% 55% at 50% -12%,#2b2070 0%,rgba(43,32,112,0) 62%),radial-gradient(90% 45% at 50% 112%,#0d3a5a 0%,rgba(13,58,90,0) 62%),var(--bg)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
/* Marges sûres : encoche / Dynamic Island en haut, barre d'accueil en bas (mode appli plein écran) */
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* ---- HUD ---- */
/* le HUD suit la largeur du terrain, sans descendre sous 343 px (sinon il déborde) */
.hud,.foot{width:100%;max-width:max(var(--pw,100%),min(100%,343px))}
.hud{display:grid;gap:9px;box-sizing:border-box;padding:10px 12px 11px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
/* en haut : niveau, gros score et vies à gauche ; bouton de pouvoir du vaisseau et pause à droite */
.top{display:flex;align-items:center;gap:10px;min-height:46px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.who .k{overflow:hidden;text-overflow:ellipsis}
.who .v{font-size:22px;letter-spacing:.02em}
.k{font-family:var(--body);font-weight:600;font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.v{font-family:var(--display);font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.v small{font-size:9px;color:var(--muted)}
.lives{display:flex;gap:4px;height:7px;align-items:center;margin-top:2px}
.lives i{width:15px;height:7px;background:var(--accent);border-radius:4px;box-shadow:0 0 8px rgba(255,92,138,.65)}
.lives i.off{background:rgba(255,255,255,.1);box-shadow:none}
/* bouton de pouvoir : anneau (conic-gradient) qui se vide pendant l'effet et se remplit pendant la recharge */
.pw{--p:1;--c:#ff9a4d;flex:none;width:46px;height:46px;padding:3px;box-sizing:border-box;border:0;border-radius:50%;cursor:pointer;
  background:conic-gradient(var(--c) calc(var(--p) * 1turn),rgba(255,255,255,.1) 0);transition:transform .15s var(--ease),box-shadow .3s}
.pw .in{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1a1d3d;color:#c9cdf2;font-family:var(--display);font-size:14px}
.pw svg{width:20px;height:20px;fill:currentColor}
.pw:active{transform:scale(.9)}
/* Frénétique, furie prête : braise au centre, flamme dorée, mur de flammes animé autour (canvas #furycv, drawFury) */
.pw{position:relative}
#furycv{position:absolute;left:-13px;top:-26px;width:72px;height:76px;pointer-events:none;z-index:2}
.pw.fury{--c:#ff8a2a;animation:none;box-shadow:0 0 0 2px rgba(255,170,60,.35),0 0 24px rgba(255,90,20,.8)}
.pw.fury .in{position:relative;z-index:1;background:radial-gradient(circle at 50% 62%,#7a1a06 0,#3a0a08 55%,#170608 100%);color:#ffd27a}
.pw.fury svg{width:22px;height:22px;filter:drop-shadow(0 0 4px #ff8a2a) drop-shadow(0 0 1px #fff3c4)}
.pw.ready{box-shadow:0 0 0 3px rgba(255,154,77,.2),0 0 18px rgba(255,92,138,.6);animation:pwpulse 1.6s ease-in-out infinite}
.pw.ready .in{background:var(--grad);color:#fff}
.pw.on{--c:#ffd0d6;box-shadow:0 0 22px rgba(255,31,61,.75)}
.pw.on .in{background:linear-gradient(135deg,#ff6b6b,#ff1f3d);color:#fff}
.pw.cd{--c:#8f95c6}
.pw.guard{--c:#5dffb0;cursor:default;box-shadow:0 0 14px rgba(93,255,176,.35)}
.pw.guard .in{background:radial-gradient(circle,#1d4a3c,#12261f);color:#5dffb0}
.pw.hurt{--c:#ff5c8a;cursor:default}
.pw.armor{--c:var(--ac,#5dffb0);cursor:default}
.pw.armor .in{color:var(--ac,#5dffb0);font-size:13px}
.pw.hurt .in{color:#ff9fb5}
/* Flambeur : jeton de casino avec le nombre de jetons (l'anneau doré montre la réserve, 5 au plus) */
.pw.chip{--c:#ffd23f}
.pw.chip .in{background:radial-gradient(circle,#2a1520 0 50%,transparent 51%),repeating-conic-gradient(#5a1a2a 0 22.5deg,#3a3550 22.5deg 45deg);color:#8f95c6;font-size:17px}
.pw.chip.ready .in{background:radial-gradient(circle,#b0122c 0 50%,transparent 51%),repeating-conic-gradient(#ff3b5c 0 22.5deg,#fff 22.5deg 45deg);color:#fff;text-shadow:0 1px 0 #5a0010}
.pw.chip.ready{box-shadow:0 0 0 3px rgba(255,210,63,.2),0 0 18px rgba(255,210,63,.55)}
.pw.chip.on .in{background:radial-gradient(circle,#ffd23f 0 50%,transparent 51%),repeating-conic-gradient(#ff3b5c 0 22.5deg,#fff 22.5deg 45deg);color:#5a0010;animation:chipspin .5s linear infinite}
@keyframes chipspin{to{transform:rotate(1turn)}}
@keyframes pwpulse{50%{box-shadow:0 0 0 5px rgba(255,154,77,.12),0 0 26px rgba(255,92,138,.8)}}
/* machine à sous du Flambeur, à la place du jeton pendant un tirage */
.slotcv{flex:none;width:96px;height:40px;margin-right:-2px;cursor:pointer}
.pbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer;border-radius:13px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transition:transform .15s var(--ease),background .2s}
.pbtn i{width:4px;height:13px;background:var(--text);border-radius:2px}
.pbtn:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.meterRow{display:flex;align-items:center;gap:10px}
.meter{position:relative;flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:99px}
.meter .fill{height:100%;width:0;border-radius:99px;background:var(--grad-cool);box-shadow:0 0 12px rgba(67,224,255,.45);transition:width .45s var(--ease)}
.meter .goal{position:absolute;left:75%;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ball);box-shadow:0 0 8px rgba(255,210,63,.7)}
.pct{font-family:var(--display);font-size:12px;min-width:7ch;text-align:right;font-variant-numeric:tabular-nums}
.pct small{color:var(--muted);font-size:9px}
/* rangée de pouvoirs à hauteur fixe, toujours réservée : la faire apparaître ou disparaître changeait
   la hauteur du HUD, donc la taille et la position du terrain (saccade à la fin d'un bonus) */
.powers{display:flex;gap:6px;flex-wrap:nowrap;height:22px;overflow:hidden}
/* Prédateur : jauge SANG !, son carburant (goutte qui palpite, plus vite pendant le carnage ; grise et clignotante à sec) */
.blood{flex:1 1 130px;min-width:100px;display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 5px;box-sizing:border-box;border:1px solid rgba(255,42,58,.5);border-radius:99px;background:rgba(120,0,20,.28);font-family:var(--title);font-weight:800;font-size:9px;letter-spacing:.08em;color:#ff5a6a;white-space:nowrap}
.blood .drop{width:13px;height:13px;flex:none;fill:#ff2a3a;filter:drop-shadow(0 0 4px rgba(255,42,58,.85));animation:dropbeat var(--bt,1s) ease-in-out infinite}
.blood .bm{position:relative;flex:1;min-width:30px;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.blood .bm i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:99px;background:linear-gradient(90deg,#6a000e,#ff2a3a);box-shadow:0 0 10px rgba(255,42,58,.7)}
.blood.low{border-color:rgba(160,165,190,.5);background:rgba(60,64,90,.3);color:#b8bcd0;animation:bloodlow .6s steps(2) infinite}
.blood.low .drop{fill:#8a8fa8;filter:none}
.blood.low .bm i{background:linear-gradient(90deg,#4a4e66,#a0a4bc);box-shadow:none}
@keyframes dropbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.32)}24%{transform:scale(1)}36%{transform:scale(1.18)}50%{transform:scale(1)}}
@keyframes bloodlow{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.blood .drop,.blood.low{animation:none}}
.powers .chip{flex:0 1 auto;min-width:0;box-sizing:border-box;height:22px;gap:5px;padding:4px 8px 4px 5px;letter-spacing:.04em}
.powers .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.powers .chip b{flex:none}
.powers .chip .t{flex:0 50 44px;min-width:12px}
.powers .chip span{flex:0 1 auto}
.chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 6px;border:1px solid var(--line-2);border-radius:99px;background:rgba(255,255,255,.06);font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.1em}
.chip b{width:10px;height:10px;border-radius:50%}
.chip .t{position:relative;width:44px;height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.chip .t i{position:absolute;left:0;top:0;bottom:0;background:currentColor;border-radius:99px}
.chip span{color:var(--text)}

/* ---- Terrain ---- */
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:16px;touch-action:none;
  box-shadow:0 0 0 1px rgba(170,178,255,.18),0 24px 60px rgba(0,0,0,.55),0 0 70px rgba(120,100,255,.2)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(80% 60% at 50% 50%,rgba(7,9,22,.15),rgba(7,9,22,.55));animation:ovin .3s ease both;transition:opacity .2s ease}
.overlay.out{opacity:0;pointer-events:none}
.overlay.out .card{transform:scale(.97);transition:transform .2s ease}
@keyframes ovin{from{opacity:0}}
/* reflets qui glissent lentement sur les dégradés */
@keyframes sheen{to{background-position:-200% 0}}
@keyframes shine{0%,62%{transform:translateX(-130%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}

/* ---- Cartes (menu, niveaux, pause, fin) ---- */
.card{width:100%;max-width:330px;max-height:100%;overflow:auto;display:grid;gap:14px;box-sizing:border-box;padding:22px 20px;border-radius:24px;
  background:linear-gradient(180deg,rgba(34,38,82,.9),rgba(15,18,42,.93));border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09);
  scrollbar-width:none}
.card.in{animation:cardin .4s var(--ease) both}
.card::-webkit-scrollbar{display:none}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.card h1,.card h2{font-family:var(--title);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
.card h1{font-size:27px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,92,138,.3))}
.card h1 span,.card h2 span{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.28em;margin-bottom:8px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.card h2{font-size:21px}
.card h2.rec{background:linear-gradient(135deg,#ffe27a,#ff9a4d);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0;font-size:15px;line-height:1.45}
.card .keys{font-size:13px;color:var(--muted)}
.card .new{font-size:13px;line-height:1.4;padding:9px 12px;border-radius:14px;background:rgba(255,92,138,.08);border:1px solid rgba(255,92,138,.25)}
.card .new .foecv{float:left;width:48px;height:48px;margin:1px 10px 2px 0;border-radius:13px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.09),rgba(255,255,255,0) 72%),rgba(6,4,20,.55);border:1px solid rgba(255,255,255,.08)}
.card .new::after{content:"";display:block;clear:both}
.card .new b{font-family:var(--display);font-size:10.5px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.rows{display:grid;gap:8px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-family:var(--display);font-size:12px}
.rows div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.rows div span:first-child{color:var(--muted)}
.rows .total{border-top:1px solid var(--line);padding-top:9px;color:var(--ball)}

/* ---- Boutons ---- */
.btn{font-family:var(--title);font-weight:700;font-size:14px;letter-spacing:.08em;color:#fff;border:0;padding:15px 16px;border-radius:16px;cursor:pointer;
  background:var(--grad);text-shadow:0 1px 0 rgba(120,20,50,.35);
  box-shadow:0 10px 26px rgba(255,92,138,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(120,20,60,.25);
  transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 4px 14px rgba(255,92,138,.3),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(120,20,60,.25)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line-2);font-size:11px;text-shadow:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.ghost:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{font-family:var(--display);font-size:10px;letter-spacing:.04em;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:11px 2px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-checked="true"]{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,92,138,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .k{flex:1}
.stepper button{width:40px;height:40px;font-family:var(--display);font-size:16px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line-2);border-radius:13px;cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:transform .15s var(--ease)}
.stepper button:active{transform:scale(.9)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper .v{min-width:3ch;text-align:center;font-size:18px}
.count{margin:-4px 0 0;text-align:center;font-size:12px!important;color:var(--muted)}
/* le bouton principal reste visible quand la carte défile */
.card #go{position:sticky;bottom:0;z-index:1}
details{font-size:13px;color:var(--muted);line-height:1.45;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
details summary{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.16em;cursor:pointer;color:var(--text);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+';display:inline-block;width:1.2em;color:var(--accent);font-weight:700}
details[open] summary::before{content:'−'}
details ul{margin:10px 0 2px;padding-left:16px;display:grid;gap:6px}
details li::marker{color:var(--accent)}
details li b{color:var(--text);font-weight:600}
.btn:focus-visible,.mini:focus-visible,.pbtn:focus-visible,.seg button:focus-visible,.stepper button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- Maîtrise et arbre du vaisseau ---- */
.smast{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.smast .k{font-size:11px;letter-spacing:.12em;color:var(--text);font-family:var(--display);font-weight:700;white-space:nowrap}
.smast .mbar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.smast .mbar i{display:block;height:100%;border-radius:9px;background:var(--grad)}
.smast .mtree{display:inline-flex;align-items:center;gap:6px}
.smast .mtree b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.card.trees{gap:10px;max-width:380px}
.tpts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tpts .pips{display:flex;gap:3px}
.tpts .pips i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line-2)}
.tpts .pips i.av{border-color:var(--sc)}
.tpts .pips i.on{background:var(--sc);border-color:var(--sc);box-shadow:0 0 6px var(--sc)}
.tpts .mini{margin-left:auto}
.tnote,.tmsg{margin:0;font-size:12px;color:var(--muted)}
.tmsg{min-height:1.2em;color:#ffd23f}
.tree{display:grid;gap:10px}
.tbr{display:grid;gap:6px;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.tbh b{font-family:var(--title);font-size:12px;letter-spacing:.12em;color:var(--sc)}
.tbh span{margin-left:8px;font-size:11px;color:var(--muted)}
.tnode{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;width:100%;padding:7px 9px 7px 7px;border-radius:12px;cursor:pointer;
  background:rgba(7,9,22,.45);border:1px solid var(--line);color:var(--text);font:inherit;transition:border-color .2s,box-shadow .2s,opacity .2s}
.tnode i{width:22px;height:22px;margin-top:1px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:11px;color:var(--muted);border:2px solid var(--line-2);box-sizing:border-box}
.tnode.ult i{border-radius:6px}
.tnode b{display:block;font-family:var(--display);font-size:13px}
.tnode small{display:block;font-size:11.5px;line-height:1.35;color:var(--muted)}
.tnode em{font-style:normal;font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.14em;color:#ffd23f}
.tnode.on{border-color:var(--sc);box-shadow:0 0 0 1px var(--sc) inset,0 0 14px rgba(255,255,255,.08)}
.tnode.on i{background:var(--sc);border-color:var(--sc);color:#14111c}
.tnode.lock{opacity:.5}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.mrow b{font-family:var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.mrow em{grid-column:1/-1;font-style:normal;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mrow.up{border-color:rgba(255,154,77,.55);box-shadow:0 0 16px rgba(255,92,138,.25)}

/* ---- Choix du vaisseau ---- */
.card.ships{gap:11px}
.shead{display:flex;align-items:center;gap:10px}
.shead h2{flex:1}
.back{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--line-2)}
.back svg,.arrow svg{width:16px;height:16px;fill:none;stroke:var(--text);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sstage{position:relative;height:112px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
#shipcv{width:100%;height:100%;border-radius:18px;box-shadow:none}
.arrow{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:50%;
  background:rgba(7,9,22,.6);border:1px solid var(--line-2);transition:transform .15s var(--ease)}
.arrow:active{transform:scale(.88)}
.arrow.l{left:8px}.arrow.r{right:8px}
.sname{text-align:center;display:grid;gap:3px}
.sname b{font-family:var(--title);font-weight:800;font-size:24px;line-height:1}
.sname span{font-size:12px;color:var(--muted)}
.sstats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.sstats div{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sstats .k{letter-spacing:.1em}
.sstats .dots{display:flex;gap:3px}
.sstats .dots i{width:9px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.sstats .dots.l i{background:var(--accent);box-shadow:0 0 6px rgba(255,92,138,.6)}
.sstats .dots.s i.on{background:var(--cyan)}
.sstats .dots.b i.on{background:var(--ball)}
.sstats .pwr{font-family:var(--display);font-size:10px}
.card p.sdesc{font-size:13px;line-height:1.4;color:#c9cdf2;text-align:center;min-height:3.5em}
.spage{display:flex;justify-content:center;gap:2px;min-width:0;max-width:100%}
.spage button{flex:0 1 28px;min-width:0;height:22px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spage button i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);transition:width .25s var(--ease),background .25s}
.spage button[aria-current="true"]{flex-basis:34px}
.spage button[aria-current="true"] i{width:min(22px,100%);background:var(--text)}

/* ---- Pied de page, mode test ---- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex:none}
.foot .tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto}
.mini{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.08em;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:8px 12px;cursor:pointer;white-space:nowrap;
  transition:transform .15s var(--ease),background .2s}
.mini:active{transform:scale(.93);background:rgba(255,255,255,.1)}
.testbar{width:var(--pw,100%);max-width:100%;display:grid;gap:6px;flex:none}
/* une ligne par rangée, qu'on fait défiler du doigt : la barre reste basse et laisse la place au terrain */
.trow{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);padding-right:18px}
.trow::-webkit-scrollbar{display:none}
.trow .k{flex:none;width:58px;font-size:9px}
.trow .mini{flex:none;padding:6px 9px;font-size:9.5px;letter-spacing:.05em;color:var(--text)}
.trow select.mini{-webkit-appearance:none;appearance:none;color:#ffd23f;border-color:rgba(255,210,63,.5);background:rgba(255,210,63,.08);max-width:190px}
.trow select.mini option{background:#14111c;color:#fff}
.trow .mini.gold{color:#ffd23f;border-color:rgba(255,210,63,.5);background:rgba(255,210,63,.08)}
.hint-touch{display:none}
@media (pointer:coarse){.hint{display:none}.hint-touch{display:inline}}
@media (max-width:380px){.hint-touch,.hint{display:none}}

/* ---- Pouvoirs actifs ---- */
.chip.inv{color:#ffe27a}.chip.inv b{background:conic-gradient(#ff5d5d,#ffd23f,#5dff9a,#46d9ff,#b98bff,#ff5d5d)}
.chip.spd{color:#46d9ff}.chip.spd b{background:#46d9ff;box-shadow:0 0 6px #46d9ff}
.chip.sup{color:#ffd23f;border-color:#ffd23f;animation:supchip 1s linear infinite}
.chip.sup b{background:radial-gradient(circle,#fff6c8,#ffd23f 60%,#ff7a4d)}
@keyframes supchip{0%,100%{box-shadow:0 0 6px #ffd23f}50%{box-shadow:0 0 14px #ff7a4d}}
.chip.hyp{color:#9ff3ff;border-color:#46d9ff;animation:hypchip .3s steps(2) infinite}
.chip.hyp b{background:#fff;box-shadow:0 0 6px #46d9ff}
.chip.chr{color:#7cf5c4}.chip.chr b{background:#7cf5c4;box-shadow:0 0 6px #7cf5c4}
.chip.schr{color:#7cf5c4;border-color:#7cf5c4;animation:supchip 1.6s linear infinite}.chip.schr b{background:radial-gradient(circle,#fff,#7cf5c4 60%,#43e0ff)}
.chip.rage{color:#ff5c6e;border-color:#ff1f3d;animation:ragechip .45s ease-in-out infinite}.chip.rage b{background:#ff1f3d;box-shadow:0 0 8px #ff1f3d}
@keyframes ragechip{50%{box-shadow:0 0 12px rgba(255,31,61,.8)}}
.chip.frag{color:#ff5c6e;border-color:#ff1f3d}.chip.frag b{background:#ff1f3d;box-shadow:0 0 8px #ff1f3d}
.chip.snail{color:#d9b38c}.chip.snail b{background:#a8784a}
.chip.guard{color:#ff9fb5}.chip.guard b{background:#5dffb0;box-shadow:0 0 6px #5dffb0}
@keyframes hypchip{0%{box-shadow:0 0 4px #46d9ff}50%{box-shadow:0 0 14px #9ff3ff,0 0 2px #fff}}
.stage.super canvas{animation:supglow .8s linear infinite}
@keyframes supglow{0%{box-shadow:0 0 0 2px #ffd23f,0 0 28px #ffd23f}33%{box-shadow:0 0 0 2px #ff5dd2,0 0 28px #ff5dd2}66%{box-shadow:0 0 0 2px #46d9ff,0 0 28px #46d9ff}100%{box-shadow:0 0 0 2px #ffd23f,0 0 28px #ffd23f}}
.lives.boost i:not(.off){animation:lifeboost .32s ease-out 4}
@keyframes lifeboost{50%{transform:scaleY(1.35);background:#ffd23f;box-shadow:0 0 10px #ff5d8f}}
/* ---- Écran titre (plein écran) ---- */
.title{position:fixed;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;background:#06030f;transition:opacity .26s ease;scrollbar-width:none}
.title::-webkit-scrollbar{display:none}
.title.out{opacity:0;pointer-events:none}
.title canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.tin{position:relative;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:26px;
  padding:max(30px,calc(env(safe-area-inset-top) + 20px)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tlogo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:3vh;animation:tfloat 5s ease-in-out infinite}
.tlogo .tsub{font-size:10px;font-weight:600;letter-spacing:.32em;color:#c9cdf2;padding:6px 13px;border:1px solid var(--line-2);border-radius:99px;background:rgba(10,8,30,.55);margin-bottom:18px}
.tlogo b{display:block;font-family:var(--title);font-weight:900;line-height:.95;white-space:nowrap}
.tlogo b i{display:inline-block;font-style:normal;-webkit-background-clip:text;background-clip:text;color:transparent}
.tlogo .t1{font-size:min(18.5vw,90px);letter-spacing:.04em}
.tlogo .t1 i{background-image:linear-gradient(180deg,#fff7d6 10%,#ffd23f 42%,#ff8a3d 60%,#ff3b7a 100%);filter:drop-shadow(0 4px 0 #4a0f3a) drop-shadow(0 0 16px rgba(255,92,138,.55))}
.tlogo .t2{font-size:min(11.4vw,56px);letter-spacing:.06em;margin-top:8px}
.tlogo .t2 i{background-image:linear-gradient(180deg,#effcff 10%,#43e0ff 46%,#8c6bff 100%);filter:drop-shadow(0 4px 0 #1a1050) drop-shadow(0 0 16px rgba(67,224,255,.5))}
.tlogo .tag{margin-top:16px;font-size:13px;color:#c9cdf2;letter-spacing:.05em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.title.intro .tlogo b i{animation:tdrop .7s var(--ease) both;animation-delay:calc(var(--i) * 65ms + .1s)}
.title.intro .tlogo .t2 i{animation-delay:calc(var(--i) * 65ms + .55s)}
.title.intro .tlogo .tag,.title.intro .tlogo .tsub{animation:cardin .6s ease 1.1s both}
@keyframes tdrop{from{opacity:0;transform:translateY(-70px) scale(.5)}}
@keyframes tfloat{50%{transform:translateY(-7px)}}
.tmenu{width:100%;max-width:360px;display:grid;gap:12px;padding:16px;box-sizing:border-box;border-radius:24px;background:rgba(14,10,36,.66);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.title.intro .tmenu{animation:cardin .55s var(--ease) .9s both}
.tmenu .keys{margin:-3px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted);text-align:center}
.tmenu .btn.play{font-size:22px;padding:18px;letter-spacing:.14em;animation:pwpulse 1.8s ease-in-out infinite}
.tmenu .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tmenu .duo .btn{padding:11px 6px;font-size:11px}
.tmenu .duo .btn:only-child{grid-column:1/-1}
.tmenu .btn small{display:block;margin-top:4px;font-family:var(--body);font-size:9.5px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.tfoot{display:flex;justify-content:center;gap:8px}
@media (prefers-reduced-motion:reduce){.tlogo,.title.intro .tlogo b i,.title.intro .tmenu,.title.intro .tlogo .tag,.title.intro .tlogo .tsub,.tmenu .btn.play{animation:none}}
/* ---- Finitions animées ---- */
.card h1{background:linear-gradient(90deg,#ff5c8a,#ff9a4d,#ffd23f,#ff9a4d,#ff5c8a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:sheen 7s linear infinite;filter:none}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn:not(.ghost)::after{content:'';position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));animation:shine 3.8s ease-in-out infinite}
.meter .fill{position:relative;overflow:hidden}
.meter .fill::after{content:'';position:absolute;top:0;bottom:0;left:0;width:35%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shine 2.6s ease-in-out infinite}
.chip{animation:chipin .35s var(--ease) both}
@keyframes chipin{from{opacity:0;transform:scale(.7)}}
.lives i{transition:background .3s,box-shadow .3s}
.seg button{transition:background .3s,color .3s,box-shadow .3s,transform .15s var(--ease)}
.seg button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.card h1,.btn::after,.pw.ready,.pw.chip.on .in,.meter .fill::after,.chip,.overlay{animation:none}}
@media (prefers-reduced-motion:reduce){.stage.super canvas,.chip.sup{animation:none;box-shadow:0 0 0 2px #ffd23f}.chip.hyp,.lives.boost i,.card.in{animation:none}}
</style>
</head>
<body>

<div class="title" id="title" hidden><canvas id="titlecv" aria-hidden="true"></canvas><div class="tin" id="tin"></div></div>

<div class="app">
  <header class="hud">
    <div class="top">
      <div class="who">
        <span class="k" id="lab">SPACE CONQUEST</span>
        <span class="v" id="score" aria-label="Score">0</span>
        <span class="lives" id="lives" aria-label="Vies"></span>
      </div>
      <canvas class="slotcv" id="slotcv" hidden aria-hidden="true"></canvas>
      <button class="pw" id="pw" hidden aria-label="Pouvoir du vaisseau"><span class="in" id="pwi"></span><canvas id="furycv" width="144" height="152" aria-hidden="true" hidden></canvas></button>
      <button class="pbtn" id="pz" aria-label="Pause"><i></i><i></i></button>
    </div>
    <div class="meterRow">
      <div class="meter" aria-label="Terrain conquis"><div class="fill" id="bar"></div><i class="goal" id="goal"></i></div>
      <div class="pct" id="pct">0%<small>/75</small></div>
    </div>
    <div class="powers" id="powers"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Terrain de jeu"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="testbar" id="testbar" hidden>
    <div class="trow"><span class="k">VAISSEAU</span>
      <button class="mini" id="tprev" aria-label="Vaisseau précédent">‹</button><button class="mini gold" id="tship">VEINARD</button><button class="mini" id="tnext" aria-label="Vaisseau suivant">›</button><button class="mini" id="treset">RÉINITIALISER</button><button class="mini" id="trefill">RECHARGER</button><button class="mini gold" id="ttree">ARBRE</button><select class="mini" id="tforce" aria-label="Gain de la machine à sous" hidden></select><button class="mini" id="tquit">QUITTER</button>
    </div>
    <div class="trow"><span class="k">BONUS</span>
      <button class="mini gold" data-item="coin" id="tcoin" hidden>+JETON</button><button class="mini" data-item="inv">CASQUE</button><button class="mini gold" data-item="sup">SUPER CASQUE</button><button class="mini" data-item="spd">VITESSE</button><button class="mini" data-item="life">VIE</button><button class="mini" data-item="terr">TERRITOIRE</button><button class="mini gold" data-item="sterr">SUPER BOMBE</button><button class="mini gold" data-item="sspd">SUPER VITESSE</button><button class="mini gold" data-item="slife">SUPER VIE</button><button class="mini" data-item="chr">CHRONO</button><button class="mini gold" data-item="schr">SUPER CHRONO</button>
    </div>
    <div class="trow"><span class="k">ENNEMIS</span>
      <button class="mini" data-foe="out">+BOULE</button><button class="mini" data-foe="perf">+PERFO</button><button class="mini" data-foe="inn">+GARDIEN</button><button class="mini" data-foe="amph">+TROU NOIR</button><button class="mini" data-foe="puls">+PULSAR</button><button class="mini" data-foe="hunt">+CHASSEUR</button><button class="mini" data-foe="div">+DIVISEUR</button><button class="mini" data-foe="ghost">+SPECTRE</button><button class="mini" id="tclear">VIDER</button>
    </div>
  </div>

  <footer class="foot">
    <span class="hint">Flèches ou ZQSD · Espace : stop · P : pause</span>
    <span class="hint-touch">Glisse pour diriger · Tape pour t'arrêter</span>
    <span class="tools"><button class="mini" id="scr">ÉCRAN : COULEUR</button><button class="mini" id="snd">SON : OUI</button></span>
  </footer>
</div>

<script>
(() => {
'use strict';
// Le monde (dessin, ennemis, bonus, distances et vitesses) se compte en cases d'origine : COLS × ROWS. La grille du
// terrain, du fil et du vaisseau est G fois plus fine (GC × GR cases, demande de Fabien : un jeu plus « HD », des tracés
// plus précis). G = 1 redonne la grille d'origine. Conversions : wx / wy (case de la grille → monde), gc (monde → grille).
const G = 2;
const COLS = 50, ROWS = 66, B = 2, GC = COLS * G, GR = ROWS * G, BG = B * G, N = GC * GR, STEP = 1 / 17 / G, POWER_T = 10, MAX_LEVEL = 25;
const R_SEA = 0.42, R_LAND = 0.4, R_AMPH = 1.2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const DIFFS = [
  { name: 'Débutant', short: 'DÉB', goal: .75, sp: .85, maxPerf: 3, mobile: 99, note: 'Objectif 75 %. Moins d\'ennemis, et plus lents. Bonus fixes.' },
  { name: 'Confirmé', short: 'CONF', goal: .80, sp: 1, maxPerf: 6, mobile: 6, note: 'Objectif 80 %. De nouveaux ennemis au fil des niveaux, bonus mobiles en fin de parcours.' },
  { name: 'Expert', short: 'EXP', goal: .85, sp: 1.2, maxPerf: 6, mobile: 3, note: 'Objectif 85 %. Plus d\'ennemis, tout va vite, bonus mobiles.' }
];

const THEMES = {
  color: { label: 'COULEUR', empty:'#0b0e22', dot:'#1c2148', vignette:'rgba(120,90,255,0.22)', landA:'#5468ff', landB:'#5468ff', landGrad:['#4a6dff', '#9a5cff'], shine:null, space:true, smooth:true, edge:'#dfe4ff',
    trail:'#ff7a4d', trailCore:'rgba(42,15,42,0.85)', trailFill:'rgba(255,122,77,0.16)', shock:'#ffffff',
    ball:'#ffd23f', ballHi:'#fff7cf', ballLo:'#d9901a', ballEye:'#5a3200', perf:'#7dff9a', perfLo:'#1e8a4a', puls:'#46d9ff', pulsHi:'#e6fbff', hunt:'#ff4466', huntHi:'#ffd0da', div:'#ff9f43', divHi:'#ffe2bd', ghost:'#d9d4ff', ink:'#1a0c24',
    crawler:'#ff4d8d', crawlerCore:'#ffd6e6', amph:'#a58cff', amphHi:'#f1ecff', amphRing:'rgba(220,210,255,0.8)', amphInv:'#1a1230', hole:'#030108',
    playerLand:'#ffffff', playerLandInk:'#100d18', playerSea:'#ffffff', playerSeaInk:'#100d18', flame:'#ff7a4d',
    danger:'#ff3b3b', landP:'#b9a8ff', fresh:'230,236,255', flash:'255,59,59', textShadow:'#100d18',
    items:{ inv:'#ffe27a', spd:'#46d9ff', life:'#ff7a4d', terr:'#9aa6ff', sup:'#ffd23f', sterr:'#ffd23f', sspd:'#9ff3ff', slife:'#ff5d8f', chr:'#7cf5c4', schr:'#7cf5c4', coin:'#ffd23f' }, itemBg:'rgba(16,13,24,0.85)', itemInk:'#100d18', glow:true, rainbow:true },
  myx3: { label: 'MYX-3', empty:'#8fbaf2', dot:'#80ace9', vignette:'rgba(230,242,255,0.5)', landA:'#14295c', landB:'#183066', shine:'rgba(255,255,255,0.05)', edge:'#081430',
    trail:'#0b1838', trailCore:'#8fbaf2', trailFill:'rgba(11,24,56,0.10)', shock:'#0b1838',
    ball:'#0b1838', ballHi:'#5a80c8', ballLo:'#0b1838', ballEye:'#8fbaf2', perf:'#0b1838', perfLo:'#5a80c8', puls:'#0b1838', pulsHi:'#5a80c8', hunt:'#0b1838', huntHi:'#5a80c8', div:'#0b1838', divHi:'#5a80c8', ghost:'#0b1838', ink:'#8fbaf2',
    crawler:'#cfe2ff', crawlerCore:'#0b1838', amph:'#0b1838', amphHi:'#5a80c8', amphRing:'rgba(11,24,56,0.85)', amphInv:'#cfe2ff', hole:'#0b1838',
    playerLand:'#cfe2ff', playerLandInk:'#0b1838', playerSea:'#0b1838', playerSeaInk:'#8fbaf2', flame:'#0b1838',
    danger:'#0b1838', landP:'#0b1838', fresh:'11,24,56', flash:'11,24,56', textShadow:'#8fbaf2',
    items:{ inv:'#0b1838', spd:'#0b1838', life:'#0b1838', terr:'#0b1838', sup:'#0b1838', sterr:'#0b1838', sspd:'#0b1838', slife:'#0b1838', chr:'#0b1838', schr:'#0b1838', coin:'#0b1838' }, itemBg:'rgba(143,186,242,0.92)', itemInk:'#8fbaf2', glow:false, rainbow:false }
};

const ITEM = {
  inv: { label: 'CASQUE', medium: 'sea' },
  spd: { label: 'VITESSE', medium: 'land' },
  life:{ label: '+1 VIE', medium: 'sea' },
  terr:{ label: 'TERRITOIRE', medium: 'sea' },
  sup: { label: '', medium: 'sea' },
  sterr: { label: '', medium: 'sea' },
  sspd: { label: '', medium: 'land' },
  slife: { label: '', medium: 'sea' },
  chr: { label: 'CHRONO', medium: 'sea' },
  schr: { label: '', medium: 'sea' },
  coin: { label: '+1 JETON', medium: 'sea' }
};
// Versions « super » (rares) : type super -> bonus de base dont elles reprennent l'icône
const SUPER = { sup: 'inv', sterr: 'terr', sspd: 'spd', slife: 'life', schr: 'chr' };

// Vaisseaux au choix (idée de Fabien). body() trace et remplit la coque (unités de case, nez vers +x) ;
// tail / fw : départ et demi-largeur de la flamme ; pit : cockpit [x, rayon x, rayon y]
// Les pouvoirs se rechargent en traçant dans la zone à conquérir (demande de Fabien), pas avec le temps :
// GUARD_CELLS pour le bouclier de l'Encaisseur, RW_CELLS pour le rembobinage
// Rembobineur : jauge de RW_SPAN secondes de retour en arrière ; une photo par image (RW_SNAP), rejouées au ralenti
// (RW_STEP par photo, soit le quart de la vitesse : 3 s se rembobinent en 12 s) pour bien voir et s'arrêter pile où on
// veut ; au crash, RW_WIN s pour décider
const GUARD_CELLS = 80, RW_CELLS = 120, RW_SPAN = 3, RW_SNAP = 1 / 60, RW_STEP = 4 / 60, RW_WIN = 3;
// ouverture des mandibules du Prédateur (0 à 1) imposée par le jeu ; null : elles mâchonnent toutes seules
var jaw = null;

const store = {
  get(k, d) { try { const v = localStorage.getItem('mbc2-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mbc2-' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mbc2-' + k); } catch (e) {} }

    if (slot.bet >= 3 || gam.chips <= 0) { sfx.warn(); return; }
    gam.chips--; slot.bet++; slot.t = 0; betSound(slot.bet); pwHud();
    if (slot.bet === 3) startSpin(true);

  if (slot) return;

function slotDraw(bet) {

    if (d < 2 || d >= bd) continue;

function setupFoePics() {

function drawFoePics(dt) {

const titleEl = $('title'), titleCv = $('titlecv'), titleCtx = titleCv.getContext('2d');

// Écran « Choisis ton vaisseau » : aperçu animé, flèches (ou glisser, ou ← →), jauges, description
let shipPick = null;
const ARROW = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
function showShips(test) {

    <div class="shead">

// barre de maîtrise sous la description du vaisseau, et le bouton de son arbre (avec les points à placer)
function masteryBar(k, test) {

// Arbre du vaisseau choisi : trois branches, on touche une compétence pour la prendre ou la rendre (avec celles en dessous)
function showTree(test, inGame) {
  const sh = SHIPS[menuShip], k = sh.key, tree = SKILLS[k], max = test ? 12 : mLevel(k);

      <div class="shead">
        <button class="back" id="tback" aria-label="Retour">${ARROW('M15 5 L8 12 L15 19')}</button>

      </div>
      <div class="tpts" style="--sc:${sh.glow}"><span class="pips">${Array.from({ length: test ? 0 : 8 }, (_, i) => `<i class="${i < list.length ? 'on' : i < max ? 'av' : ''}"></i>`).join('')}</span>
        <span>${test ? list.length + ' compétence' + (list.length > 1 ? 's' : '') : (max - list.length) + ' point' + (max - list.length > 1 ? 's' : '') + ' à placer'}</span><button class="mini" id="treset2">RÉINITIALISER</button></div>
      ${max === 0 && !test ? '<p class="tnote">Gagne un niveau avec ce vaisseau pour obtenir ton premier point.</p>' : ''}
      <div class="tree" style="--sc:${sh.glow}">${tree.map(([bn, th, nodes], bi) => `<div class="tbr"><div class="tbh"><b>${bn}</b><span>${th}</span></div>${nodes.map(([id, n, d], r) => {
        const on = set.has(id), reach = r === 0 || set.has(nodes[r - 1][0]);
        return `<button class="tnode${r === 3 ? ' ult' : ''}${on ? ' on' : ''}${!on && !reach ? ' lock' : ''}" data-b="${bi}" data-r="${r}" aria-pressed="${on}"><i>${r === 3 ? '◆' : r + 1}</i><span>${r === 3 ? '<em>ULTIME</em>' : ''}<b>${n}</b><small>${d}</small></span></button>`;
      }).join('')}</div>`).join('')}</div>
      <p class="tmsg" aria-live="polite">${msg || ''}</p>
      <button class="btn" id="go">${inGame ? 'REPRENDRE' : 'VALIDER'}</button>`, back);

    $('treset2').addEventListener('click', () => { list = []; skSave(k, list, test); sfx.cancel(); render(); });

      const bi = +b.dataset.b, r = +b.dataset.r, nodes = tree[bi][2], id = nodes[r][0];
      if (set.has(id)) { const drop = nodes.slice(r).map(x => x[0]); list = list.filter(x => !drop.includes(x)); }
      else if (r > 0 && !set.has(nodes[r - 1][0])) return render('Débloque d\'abord la compétence au-dessus.');
      else if (!test && list.length >= max) return render(max ? 'Plus de point : rends une compétence ou réinitialise.' : 'Pas encore de point : gagne un niveau avec ce vaisseau.');
      else if (!test && r === 3 && ult) return render('Une seule ultime à la fois.');
      else { list.push(id); sfx.ready(); }
      skSave(k, list, test); render();
    }));
  };
  const back = () => { if (inGame) { hideOverlay(); loadSkills(); testReset(true); S.phase = 'play'; last = performance.now(); } else showShips(test); };
  render();

// Aperçu du vaisseau choisi : il file vers le haut au milieu d'étoiles qui défilent
function drawPreview() {
  const c = $('shipcv');
  if (!c || !c.clientWidth) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3), w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext('2d'), sh = SHIPS[menuShip], px = h / 2.6, cx = w / 2, cy = h / 2;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  const hg = g.createRadialGradient(cx, cy, 0, cx, cy, h * .62);
  hg.addColorStop(0, `rgba(${rgbOf(sh.glow)},0.32)`); hg.addColorStop(1, `rgba(${rgbOf(sh.glow)},0)`);
  g.fillStyle = hg; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffffff';
  for (let k = 0; k < 26; k++) {
    const sp = 1 + k % 3, y = ((k * 53 + time * 38 * sp) % 130) / 130 * h, x = ((k * 37) % 100) / 100 * w;
    g.globalAlpha = .2 + (k % 4) * .15; g.fillRect(x, y, dpr * (sp > 2 ? 1.6 : 1), dpr * (2 + sp * 2.5));
  }
  g.globalAlpha = 1;
  g.setTransform(px, 0, 0, px, cx, cy + Math.sin(time * 2) * .05 * px);
  if (sh.key === 'enc') {
    g.strokeStyle = 'rgba(93,255,176,0.75)'; g.lineWidth = .06; g.setLineDash([.32, .2]); g.lineDashOffset = -time * 1.2;
    g.beginPath(); g.arc(0, 0, .98, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  }
  g.rotate(-Math.PI / 2 + Math.sin(time * 1.3) * .08);
  drawHull(g, sh, { neon: true, moving: true, px, ang: -Math.PI / 2 + Math.sin(time * 1.3) * .08 });
}
function startDemo() {
  resetGrid();
  for (let y = 40 * G; y < GR - BG; y++) for (let x = BG; x < 22 * G; x++) grid[at(x,y)] = 1;
  for (let y = BG; y < 14 * G; y++) for (let x = 34 * G; x < GC - BG; x++) grid[at(x,y)] = 1;

  S.filled = 0; reveal = null; drawBoard();
}
function togglePause() {
  if (S.phase === 'play') {
    S.pausedFrom = 'play'; S.phase = 'pause';
    showOverlay(`<h2><span>${S.test ? 'MODE TEST' : `NIVEAU ${pad2(S.level)} / ${MAX_LEVEL}`}</span>PAUSE</h2>${infoRows(true)}<button class="btn" id="go">REPRENDRE</button><button class="btn ghost" id="pmenu">QUITTER LA PARTIE</button><p class="count">ou touche l'écran pour reprendre</p>`, resume);
    // retour au menu : la partie reste sauvegardée au début du niveau (bouton CONTINUER)
    $('pmenu').addEventListener('click', () => { onGo = null; power.inv = 0; power.spd = 0; power.sup = 0; power.hyp = 0; power.chr = 0; power.schr = 0; power.frag = 0; ab.on = 0; ab.fury = 0; powersHud(); titleScreen(); });
  } else if (S.phase === 'pause') resume();

function resume() { hideOverlay(); S.phase = 'play'; last = performance.now(); }

/* ---------- Mode test ---------- */
const TEST_GOAL = .75;
// barre du mode test : nom du vaisseau, jeton et machine à sous seulement pour le Flambeur
function testSync() {
  $('tship').textContent = SH().name;
  $('tcoin').hidden = $('tforce').hidden = SH().key !== 'gam';
}
// pouvoirs à plein : furie, bouclier, rembobinage, blindage, jetons
function testRefill() {
  if (!S.test) return;
  ab.fury = 1; rw.charge = RW_SPAN; armor.hp = armorMax(); gam.chips = CHIPS_MAX; pred.cd = 0; pred.blood = BLOOD_MAX;
  if (P) P.guard = 0;
  powersHud(); pwHud();
}
// Réinitialisation instantanée (sans écran d'info) : terrain vierge, 2 boules et un gardien, pouvoirs à plein.
// keep : le terrain s'efface tout seul à 75 % ; on garde les mêmes ennemis, le score et les pouvoirs.
function testReset(keep) {
  if (!S.test) return;
  const kinds = keep && SH().key !== 'pred' ? foes.filter(e => !e.dead && !(e.gen > 0)).map(e => e.kind) : null;
  if (!keep) { S.score = 0; S.lives = SH().lives; }
  setupLevel(1, true);
  if (kinds) foes = kinds.map(k => makeFoe(k, DIFFS[S.diff].sp));
  else testRefill();
  rings.push({ x: (P.x + .5) / G, y: (P.y + .5) / G, r: 0, max: 30, age: 0, color: T.shock, big: true });
  sfx.start();
}
function testShip(d) {
  if (!S.test) return;
  menuShip = S.ship = (S.ship + d + SHIPS.length) % SHIPS.length; store.set('ship', S.ship);
  loadSkills(); testReset();
}
function testItem(type) {
  if (!S.test || !P || (S.phase !== 'play' && S.phase !== 'ready' && S.phase !== 'pause')) return;
  const medium = ITEM[type].medium, pp = playerPos(), cands = [];
  for (let y = 1; y < GR - 1; y++) for (let x = 1; x < GC - 1; x++) {
    const v = grid[at(x, y)];
    if (medium === 'sea' ? v !== 0 : v !== 1) continue;
    const d = Math.hypot((x + .5) / G - pp.x, (y + .5) / G - pp.y);
    if (d < 3) continue;
    cands.push([d, (x + .5) / G - .5, (y + .5) / G - .5]);
  }
  if (!cands.length) return;
  cands.sort((a, b) => a[0] - b[0]);
  const pick = cands[(Math.random() * Math.min(12, cands.length)) | 0];
  items.push({ type, x: pick[1] + .5, y: pick[2] + .5, vx: 0, vy: 0, age: 0, ttl: 30, done: false });
  announce(items[items.length - 1]);
}
function testFoe(kind) {
  if (!S.test || !P) return;
  const e = makeFoe(kind, DIFFS[S.diff].sp);
  const want = kind === 'inn' ? 1 : kind === 'amph' ? -1 : 0;
  if (want >= 0) {
    const pp = playerPos(), cands = [];
    for (let y = 0; y < GR; y++) for (let x = 0; x < GC; x++) {
      if (grid[at(x, y)] !== want) continue;
      if (Math.hypot((x + .5) / G - pp.x, (y + .5) / G - pp.y) < 10) continue;
      cands.push([(x + .5) / G - .5, (y + .5) / G - .5]);
    }
    if (!cands.length) return;
    const [x, y] = cands[(Math.random() * cands.length) | 0];
    e.x = x + .5; e.y = y + .5;
  } else { e.x = COLS / 2; e.y = ROWS * .7; }
  foes.push(e);
  rings.push({ x: e.x, y: e.y, r: 0, max: 2.5, age: 0, color: T.shock });
  sfx.appear();
}
document.querySelectorAll('#testbar [data-item]').forEach(b => b.addEventListener('click', () => { ensureAudio(); testItem(b.dataset.item); }));
document.querySelectorAll('#testbar [data-foe]').forEach(b => b.addEventListener('click', () => { ensureAudio(); testFoe(b.dataset.foe); }));
$('tclear').addEventListener('click', () => { if (S.test) { for (const e of foes) burst(e.x, e.y, T.shock, 10, 6); foes = []; } });
$('treset').addEventListener('click', () => testReset());
$('tprev').addEventListener('click', () => testShip(-1));

$('trefill').addEventListener('click', () => { testRefill(); sfx.ready(); });
$('ttree').addEventListener('click', () => { if (!S.test || S.phase === 'title') return; menuShip = S.ship; S.phase = 'pause'; showTree(true, true); });
const tforce = $('tforce');
tforce.innerHTML = '<option value="">MACHINE : AU HASARD</option><option value="none">MACHINE : PERDU (RIEN)</option>' + SLOT.map(w => `<option value="${w.k}">MACHINE : ${w.txt}</option>`).join('');
tforce.addEventListener('change', () => { gam.force = tforce.value; tforce.blur(); });

/* ---------- Contrôles ---------- */
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  z:'up', w:'up', s:'down', q:'left', a:'left', d:'right', ' ':'stop' };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Enter' && onGo && (!ov.hidden || !titleEl.hidden)) { e.preventDefault(); ensureAudio(); go(); return; }
  if (shipPick && !ov.hidden && (k === 'ArrowLeft' || k === 'ArrowRight')) { e.preventDefault(); shipPick.step(menuShip + (k === 'ArrowRight' ? 1 : -1)); return; }
  if (plan) {
    const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], z: [0, -1], w: [0, -1], s: [0, 1], q: [-1, 0], a: [-1, 0], d: [1, 0] }[k];
    if (d) { e.preventDefault(); for (let n = 0; n < G; n++) planStep(d[0], d[1]); return; }

let touch = null;
// case de la grille sous le doigt
function cellAt(e) {

}
cv.addEventListener('pointerdown', e => {

  }

cv.addEventListener('pointermove', e => {

    touch = { x: e.clientX, y: e.clientY, moved: true };
  }

cv.addEventListener('pointerup', () => { if (touch && touch.plan) planLaunch(); else if (touch && !touch.moved) { if (SH().key === 'pred' && S.phase === 'play') usePower(); else setDir('stop'); } touch = null; });

ov.addEventListener('pointerup', e => {

  else if (S.phase === 'ready') { ensureAudio(); go(); }
});

scr.addEventListener('click', () => {
