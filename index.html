<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Megabox Conquest</title>
<meta name="description" content="Remake du jeu des Sagem myX (2001) : conquiers le terrain sans te faire toucher.">
<meta name="theme-color" content="#14111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Megabox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: écran de téléphone 2001 — bandeau d'état en haut, terrain portrait au centre, réglages en pied */
:root{
  --bg:#14111c; --shell:#1f1a2b; --line:#3a3150; --text:#ece6f7; --muted:#9a90b3;
  --trail:#ff7a4d; --ball:#ffd23f; --ink:#1a0d07;
  --display:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans Condensed",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
/* Marges sûres : encoche / Dynamic Island en haut, barre d'accueil en bas (mode appli plein écran) */
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hud,.foot{width:var(--pw,100%);max-width:100%}
.hud{display:grid;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--display);font-size:11px;line-height:1.1;letter-spacing:.14em;color:var(--muted)}
.brand b{display:block;color:var(--trail);font-weight:700;font-size:19px;letter-spacing:.04em}
.stats{display:flex;gap:14px;align-items:flex-end}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.k{font-family:var(--display);font-size:9px;color:var(--muted);letter-spacing:.14em}
.v{font-family:var(--display);font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.v small{font-size:9px;color:var(--muted)}
.lives{display:flex;gap:3px;height:15px;align-items:flex-end}
.lives i{width:6px;height:14px;background:var(--trail);border-radius:1px}
.lives i.off{background:var(--line)}
.pbtn{align-self:center;width:34px;height:34px;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--shell);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0}
.pbtn i{width:4px;height:13px;background:var(--text);border-radius:1px}
.pbtn:active{background:var(--line)}
.meterRow{display:flex;align-items:center;gap:10px}
.meter{position:relative;flex:1;height:10px;background:var(--shell);border:1px solid var(--line);border-radius:2px}
.meter .fill{height:100%;width:0;background:linear-gradient(90deg,#3b4bc4,#9aa6ff);transition:width .35s ease}
.meter .goal{position:absolute;left:75%;top:-4px;bottom:-4px;width:2px;background:var(--ball)}
.pct{font-family:var(--display);font-size:12px;min-width:7ch;text-align:right;font-variant-numeric:tabular-nums}
.pct small{color:var(--muted);font-size:9px}
.powers{display:flex;gap:8px;min-height:22px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;padding:3px 8px 3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--shell);font-family:var(--display);font-size:10px;letter-spacing:.08em}
.chip b{width:9px;height:9px;border-radius:50%}
.chip .t{position:relative;width:48px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.chip .t i{position:absolute;left:0;top:0;bottom:0;background:currentColor}
.chip.inv{color:#ffe27a}.chip.inv b{background:conic-gradient(#ff5d5d,#ffd23f,#5dff9a,#46d9ff,#b98bff,#ff5d5d)}
.chip.spd{color:#46d9ff}.chip.spd b{background:#46d9ff}
.chip span{color:var(--text)}
.chip.sup{color:#ffd23f;border-color:#ffd23f;animation:supchip 1s linear infinite}
.chip.sup b{background:radial-gradient(circle,#fff6c8,#ffd23f 60%,#ff7a4d)}
@keyframes supchip{0%,100%{box-shadow:0 0 6px #ffd23f}50%{box-shadow:0 0 14px #ff7a4d}}
.stage.super canvas{animation:supglow .8s linear infinite}
@keyframes supglow{0%{box-shadow:0 0 0 2px #ffd23f,0 0 28px #ffd23f}33%{box-shadow:0 0 0 2px #ff5dd2,0 0 28px #ff5dd2}66%{box-shadow:0 0 0 2px #46d9ff,0 0 28px #46d9ff}100%{box-shadow:0 0 0 2px #ffd23f,0 0 28px #ffd23f}}
@media (prefers-reduced-motion:reduce){.stage.super canvas,.chip.sup{animation:none;box-shadow:0 0 0 2px #ffd23f}}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.55);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:rgba(20,17,28,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:6px;padding:20px 18px;width:100%;max-width:320px;max-height:100%;overflow:auto;display:grid;gap:13px;box-sizing:border-box}
.card h1,.card h2{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.card h1{font-size:25px;color:var(--trail)}
.card h1 span,.card h2 span{display:block;font-size:11px;color:var(--muted);letter-spacing:.2em;margin-bottom:6px;font-weight:400}
.card h2{font-size:20px}
.card h2.rec{color:var(--ball)}
.card p{margin:0;font-size:15px;line-height:1.45}
.card .keys{font-size:13px;color:var(--muted)}
.card .new{font-size:14px;border-left:3px solid var(--trail);padding-left:10px;color:var(--text)}
.card .new b{font-family:var(--display);font-size:11px;letter-spacing:.08em;color:var(--trail);font-weight:400}
.rows{display:grid;gap:6px;font-family:var(--display);font-size:12px}
.rows div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.rows div span:first-child{color:var(--muted)}
.rows .total{border-top:1px solid var(--line);padding-top:8px;color:var(--ball)}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.06em;background:var(--trail);color:var(--ink);border:0;padding:13px 16px;border-radius:3px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-size:11px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--shell);border:1px solid var(--line);border-radius:4px;padding:3px}
.seg button{font-family:var(--display);font-size:10px;letter-spacing:.05em;background:transparent;color:var(--muted);border:0;border-radius:2px;padding:9px 2px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--trail);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .k{flex:1}
.stepper button{width:34px;height:34px;font-family:var(--display);font-size:16px;background:var(--shell);color:var(--text);border:1px solid var(--line);border-radius:3px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper .v{min-width:3ch;text-align:center}
.count{font-family:var(--display);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.count b{font-size:22px;color:var(--text);font-weight:400}
details{font-size:13px;color:var(--muted);line-height:1.45}
details summary{font-family:var(--display);font-size:10px;letter-spacing:.1em;cursor:pointer;color:var(--text)}
details ul{margin:8px 0 0;padding-left:16px;display:grid;gap:5px}
details li b{color:var(--text);font-weight:600}
.btn:focus-visible,.mini:focus-visible,.pbtn:focus-visible,.seg button:focus-visible,.stepper button:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex:none}
.foot .tools{display:flex;gap:8px}
.mini{font-family:var(--display);font-size:10px;letter-spacing:.08em;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.testbar{width:var(--pw,100%);max-width:100%;display:grid;gap:6px;flex:none}
.trow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.trow .k{width:100%}
.trow .mini{padding:6px 7px;color:var(--text)}
.trow .mini.gold{color:#ffd23f;border-color:#ffd23f}
.hint-touch{display:none}
@media (pointer:coarse){.hint{display:none}.hint-touch{display:inline}}
@media (max-width:380px){.hint-touch,.hint{display:none}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="top">
      <div class="brand">MEGABOX<b>CONQUEST</b></div>
      <div class="stats">
        <div class="stat"><span class="k" id="dlab">NIV</span><span class="v" id="lvl">01<small>/25</small></span></div>
        <div class="stat"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
        <div class="stat"><span class="k">VIES</span><span class="lives" id="lives"></span></div>
        <button class="pbtn" id="pz" aria-label="Pause"><i></i><i></i></button>
      </div>
    </div>
    <div class="meterRow">
      <div class="meter" aria-label="Terrain conquis"><div class="fill" id="bar"></div><i class="goal" id="goal"></i></div>
      <div class="pct" id="pct">0%<small>/75</small></div>
    </div>
    <div class="powers" id="powers"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Terrain de jeu"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="testbar" id="testbar" hidden>
    <div class="trow"><span class="k">BONUS</span>
      <button class="mini" data-item="inv">CASQUE</button><button class="mini gold" data-item="sup">SUPER CASQUE</button><button class="mini" data-item="spd">VITESSE</button><button class="mini" data-item="life">VIE</button><button class="mini" data-item="terr">TERRITOIRE</button>
    </div>
    <div class="trow"><span class="k">ENNEMIS</span>
      <button class="mini" data-foe="out">+BOULE</button><button class="mini" data-foe="perf">+PERFO</button><button class="mini" data-foe="inn">+GARDIEN</button><button class="mini" data-foe="amph">+TROU NOIR</button><button class="mini" data-foe="eat">+RONGEUR</button><button class="mini" id="tclear">VIDER</button><button class="mini" id="treset">RÉINITIALISER</button><button class="mini" id="tquit">QUITTER</button>
    </div>
  </div>

  <footer class="foot">
    <span class="hint">Flèches ou ZQSD · Espace : stop · P : pause</span>
    <span class="hint-touch">Glisse pour diriger · Tape pour t'arrêter</span>
    <span class="tools"><button class="mini" id="scr">ÉCRAN : COULEUR</button><button class="mini" id="snd">SON : OUI</button></span>
  </footer>
</div>

<script>
(() => {
'use strict';
const COLS = 50, ROWS = 66, B = 2, N = COLS * ROWS, STEP = 1 / 17, POWER_T = 10, MAX_LEVEL = 25;
const R_SEA = 0.42, R_LAND = 0.4, R_AMPH = 0.5;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const DIFFS = [
  { name: 'Débutant', short: 'DÉB', goal: .75, sp: .85, maxPerf: 2, mobile: 99, note: 'Objectif 75 %. Ennemis plus lents, bonus fixes.' },
  { name: 'Confirmé', short: 'CONF', goal: .80, sp: 1, maxPerf: 2, mobile: 6, note: 'Objectif 80 %. Plus rapide, bonus mobiles en fin de parcours.' },
  { name: 'Expert', short: 'EXP', goal: .85, sp: 1.2, maxPerf: 3, mobile: 3, note: 'Objectif 85 %. Tout va vite, 3 perforateurs, bonus mobiles.' }
];

const THEMES = {
  color: { label: 'COULEUR', empty:'#100d18', dot:'#2a2338', vignette:'rgba(100,80,170,0.20)', landA:'#4b5bd4', landB:'#4454c8', shine:'rgba(255,255,255,0.07)', edge:'#aab4ff',
    trail:'#ff7a4d', trailCore:'rgba(16,13,24,0.9)', trailFill:'rgba(255,122,77,0.16)', shock:'#ffffff',
    ball:'#ffd23f', ballHi:'#fff7cf', ballLo:'#d9901a', ballEye:'#5a3200', perf:'#7dff9a', perfLo:'#1e8a4a', eat:'#ff9f43', eatLo:'#5c2600',
    crawler:'#ff4d8d', crawlerCore:'#ffd6e6', amph:'#a58cff', amphHi:'#f1ecff', amphRing:'rgba(220,210,255,0.8)', amphInv:'#1a1230', hole:'#030108',
    playerLand:'#ffffff', playerLandInk:'#100d18', playerSea:'#ffffff', playerSeaInk:'#100d18', flame:'#ff7a4d',
    danger:'#ff3b3b', landP:'#9aa6ff', fresh:'230,236,255', flash:'255,59,59', textShadow:'#100d18',
    items:{ inv:'#ffe27a', spd:'#46d9ff', life:'#ff7a4d', terr:'#9aa6ff', sup:'#ffd23f' }, itemBg:'rgba(16,13,24,0.85)', itemInk:'#100d18', glow:true, rainbow:true },
  myx3: { label: 'MYX-3', empty:'#8fbaf2', dot:'#80ace9', vignette:'rgba(230,242,255,0.5)', landA:'#14295c', landB:'#183066', shine:'rgba(255,255,255,0.05)', edge:'#081430',
    trail:'#0b1838', trailCore:'#8fbaf2', trailFill:'rgba(11,24,56,0.10)', shock:'#0b1838',
    ball:'#0b1838', ballHi:'#5a80c8', ballLo:'#0b1838', ballEye:'#8fbaf2', perf:'#0b1838', perfLo:'#5a80c8', eat:'#0b1838', eatLo:'#8fbaf2',
    crawler:'#cfe2ff', crawlerCore:'#0b1838', amph:'#0b1838', amphHi:'#5a80c8', amphRing:'rgba(11,24,56,0.85)', amphInv:'#cfe2ff', hole:'#0b1838',
    playerLand:'#cfe2ff', playerLandInk:'#0b1838', playerSea:'#0b1838', playerSeaInk:'#8fbaf2', flame:'#0b1838',
    danger:'#0b1838', landP:'#0b1838', fresh:'11,24,56', flash:'11,24,56', textShadow:'#8fbaf2',
    items:{ inv:'#0b1838', spd:'#0b1838', life:'#0b1838', terr:'#0b1838', sup:'#0b1838' }, itemBg:'rgba(143,186,242,0.92)', itemInk:'#8fbaf2', glow:false, rainbow:false }
};

const ITEM = {
  inv: { label: 'CASQUE', medium: 'sea' },
  spd: { label: 'VITESSE', medium: 'land' },
  life:{ label: '+1 VIE', medium: 'sea' },
  terr:{ label: 'TERRITOIRE', medium: 'sea' },
  sup: { label: '', medium: 'sea' }
};

const INTRO = {
  out:  ['BOULE', 'Elle rebondit dans la zone à conquérir. Si elle touche ton fil, une onde de choc le remonte et te fige.'],
  inn:  ['GARDIEN', 'Il patrouille sur ton terrain conquis. Ne le croise pas.'],
  perf: ['PERFORATEUR', 'Plus rapide que la boule, il ne rebondit pas sur ton fil : il le transperce. Son onde de choc te rattrape presque instantanément.'],
  amph: ['AMPHIBIE', 'Un trou noir qui passe partout. Approche-toi trop et il t\'aspire vers lui : éloigne-toi vite de son cercle.'],
  eat:  ['RONGEUR', 'Lent, mais il grignote une case de ton terrain chaque fois qu\'il le touche. Ton pourcentage peut redescendre !']
};

/* ---------- Stockage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('mbc2-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mbc2-' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mbc2-' + k); } catch (e) {} }
};

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), ov = $('ov');
const bg = document.createElement('canvas'), gctx = bg.getContext('2d');
const board = document.createElement('canvas'), bctx = board.getContext('2d');

let T = THEMES[store.get('theme', 'color')] || THEMES.color;
const grid = new Uint8Array(N); // 0 à conquérir, 1 conquis, 2 fil
const trailPos = new Int32Array(N).fill(-1);
const at = (x, y) => y * COLS + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const cell = (x, y) => inB(x, y) ? grid[at(x, y)] : 1;
const pad2 = n => String(n).padStart(2, '0');
const fmt = n => n.toLocaleString('fr-FR');

const S = { phase: 'title', diff: 0, level: 1, score: 0, lives: 3, filled: 0, interior: (COLS-2*B)*(ROWS-2*B),
  comp: null, test: false, bonusLeft: 0, bonusWait: 0, crashT: 0, readyT: 0, readyMode: 'start', pausedFrom: null, exploded: false };
let P = null, foes = [], items = [], trail = [], erased = [], wave = null;
let particles = [], popups = [], fresh = [], rings = [];
let reveal = null, shake = 0, flash = 0, invuln = 0, clearT = 0, scale = 10, time = 0, crashPos = null;
const power = { inv: 0, spd: 0, sup: 0 };
let slow = 0, superFlash = 0, musicT = 0, musicStep = 0, combo = 0;
let menuDiff = Math.min(2, Math.max(0, store.get('diff', 0))), menuLevel = 1;

/* ---------- Son ---------- */
let actx = null, muted = store.get('mute', false);
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
}
function tone(f, dur, type = 'square', vol = 0.045, slide = 0, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  start(){ [523,659,784].forEach((f,i)=>tone(f,.09,'square',.04,0,i*.07)); },
  draw(){ tone(880,.03,'triangle',.02); },
  capture(n){ const k=Math.min(6,2+Math.floor(n/120)); for(let i=0;i<k;i++) tone(392*Math.pow(1.26,i),.08,'square',.04,0,i*.05); },
  mega(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.12,'triangle',.05,0,.25+i*.06)); },
  shock(){ tone(1400,.6,'sawtooth',.03,-1200); },
  cancel(){ tone(500,.3,'square',.035,-300); },
  crash(){ tone(90,.5,'square',.07,-40); tone(440,.6,'sawtooth',.05,-400,.05); },
  boom(){ tone(70,.7,'sawtooth',.07,-30); tone(200,.5,'square',.04,-150,.03); },
  level(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.13,'square',.045,0,i*.1)); },
  over(){ [392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.05,0,i*.2)); },
  power(){ [660,880,1320].forEach((f,i)=>tone(f,.1,'triangle',.05,0,i*.06)); tone(1760,.25,'sine',.03,0,.2); },
  terr(){ tone(200,.7,'triangle',.06,600); [523,784,1047].forEach((f,i)=>tone(f,.15,'square',.03,0,.3+i*.08)); },
  appear(){ tone(1046,.08,'sine',.03); tone(1568,.12,'sine',.03,0,.08); },
  dissolve(){ tone(700,.35,'triangle',.04,-500); },
  smash(){ tone(160,.3,'square',.06,-100); tone(1200,.15,'triangle',.04,-900,.02); },
  warn(){ tone(1200,.05,'square',.02); },
  tick(){ tone(660,.04,'square',.025); }
};

/* ---------- Taille et dessin du terrain ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  const cs = Math.max(4, Math.min(w / COLS, h / ROWS));
  const cw = Math.floor(cs * COLS), ch = Math.floor(cs * ROWS);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = cv.width / COLS;
  bg.width = board.width = cv.width; bg.height = board.height = cv.height;
  document.documentElement.style.setProperty('--pw', cw + 'px');
  drawBg(); drawBoard();
}
new ResizeObserver(resize).observe(stage);

function drawBg() {
  gctx.setTransform(1,0,0,1,0,0); gctx.clearRect(0,0,bg.width,bg.height);
  gctx.setTransform(scale,0,0,bg.height/ROWS,0,0);
  gctx.fillStyle = T.empty; gctx.fillRect(0,0,COLS,ROWS);
  const g = gctx.createRadialGradient(COLS/2,ROWS/2,2,COLS/2,ROWS/2,ROWS*0.75);
  g.addColorStop(0, T.vignette); g.addColorStop(1,'rgba(0,0,0,0)');

/* ---------- Composition des niveaux (d'après la table d'origine) ---------- */

function newPlayer() {

/* ---------- Fil ---------- */

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1.9, -.18); ctx.lineTo(1.9, .18); ctx.closePath(); ctx.fill();

    ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.15 + Math.sin(time * 10) * .1, 0, Math.PI*2); ctx.stroke();
    glowOff();
  }

    ctx.globalAlpha = power.inv < 2 && Math.floor(time * 10) % 2 === 0 ? 0.3 : 1;
    for (let k = 0; k < 8; k++) {

      ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.05, k * Math.PI/4 + time * 3, (k + 1) * Math.PI/4 + time * 3); ctx.stroke();
    }

    ctx.fillRect(-.36, -.5, .14, .2); ctx.fillRect(-.36, .3, .14, .2);
    glowOff();

    ctx.beginPath(); ctx.moveTo(.42, 0); ctx.lineTo(.06, -.18); ctx.lineTo(-.24, -.18); ctx.lineTo(-.24, .18); ctx.lineTo(.06, .18); ctx.closePath(); ctx.fill();
    if (!P.frozen) {

      ctx.beginPath(); ctx.moveTo(-.42, -.14); ctx.lineTo(-.42 - fl, 0); ctx.lineTo(-.42, .14); ctx.closePath(); ctx.fill();

  ctx.restore();
}

function drawOut(e) {
  for (let k = e.hist.length - 1; k >= 1; k--) {
    const h = e.hist[k];
    ctx.globalAlpha = 0.22 * (1 - k / e.hist.length); ctx.fillStyle = T.ball;
    ctx.beginPath(); ctx.arc(h.x, h.y, R_SEA * (1 - k / 12), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  glowOn(T.ball, 1.1);
  const g = ctx.createRadialGradient(e.x - .14, e.y - .16, .03, e.x, e.y, R_SEA + .05);
  g.addColorStop(0, T.ballHi); g.addColorStop(.45, T.ball); g.addColorStop(1, T.ballLo);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, R_SEA + .05, 0, Math.PI*2); ctx.fill();
  glowOff();
  const a = Math.atan2(e.vy, e.vx);
  ctx.fillStyle = T.ballEye;
  ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * .2, e.y + Math.sin(a) * .2, .12, 0, Math.PI*2); ctx.fill();
}
function drawPerf(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
  glowOn(T.perf, 1);
  ctx.fillStyle = T.perf;
  ctx.beginPath(); ctx.moveTo(.7, 0); ctx.lineTo(-.1, -.4); ctx.lineTo(-.48, -.28); ctx.lineTo(-.48, .28); ctx.lineTo(-.1, .4); ctx.closePath(); ctx.fill();
  glowOff();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = T.perfLo; ctx.lineWidth = .1;
  const off = (e.ph * .35) % .3;
  for (let x = -.6; x < .8; x += .3) { ctx.beginPath(); ctx.moveTo(x + off, -.5); ctx.lineTo(x + off + .22, .5); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
}
function drawEat(e) {
  if (e.bite > 0) e.bite -= 1 / 60;
  const open = e.bite > 0 ? 0.9 : 0.25 + Math.abs(Math.sin(e.ph * 2.2)) * 0.45;
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
  glowOn(T.eat, 1);
  ctx.fillStyle = T.eat;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, .58, open * .6, Math.PI * 2 - open * .6); ctx.closePath(); ctx.fill();
  glowOff();
  ctx.fillStyle = T.eatLo;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(.42, -.08 + k * .08 - .08); ctx.lineTo(.56, -.04 + k * .08 - .08); ctx.lineTo(.42, 0 + k * .08 - .08); ctx.fill(); }
  ctx.beginPath(); ctx.arc(-.08, -.28, .1, 0, Math.PI*2); ctx.fill();
  for (let k = 0; k < 3; k++) { const a = Math.PI * (.75 + k * .25); ctx.beginPath(); ctx.arc(Math.cos(a) * .58, Math.sin(a) * .58, .08, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawInn(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.save(); ctx.rotate(e.ph * 1.3);
  glowOn(T.crawler, .8);
  ctx.fillStyle = T.crawler;
  ctx.beginPath();
  for (let k = 0; k < 8; k++) { const r = k % 2 ? 0.22 : 0.52, a = k * Math.PI / 4; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
  glowOff(); ctx.restore();
  const a = Math.atan2(e.vy, e.vx);
  ctx.fillStyle = T.crawlerCore;
  ctx.beginPath(); ctx.arc(Math.cos(a) * .1, Math.sin(a) * .1, .14, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawAmph(e) {
  const onLand = cell(Math.floor(e.x), Math.floor(e.y)) === 1;
  ctx.save(); ctx.translate(e.x, e.y);
  // zone d'aspiration : anneau en pointillés + poussière qui spirale vers le centre
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = T.amphRing; ctx.lineWidth = .06;
  ctx.setLineDash([.25, .35]); ctx.lineDashOffset = -e.ph * .6;
  ctx.beginPath(); ctx.arc(0, 0, PULL_R, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.fillStyle = onLand ? T.amphInv : T.amphHi;
  for (let k = 0; k < 14; k++) {
    const f = (e.ph * .25 + k / 14) % 1, r = PULL_R * (1 - f) + .5;
    const a = k * 2.4 + f * 5 + e.ph * .5;
    ctx.globalAlpha = Math.min(1, f * 1.6) * .8;
    ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, .06 + f * .06, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = T.amph; ctx.lineWidth = .28;
  ctx.beginPath(); ctx.arc(0, 0, R_AMPH + .45, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = T.amphHi; ctx.lineWidth = .08;

  glowOff(); ctx.restore();

  const puls = 1 + Math.sin(e.ph * 2) * 0.06;
  glowOn(T.amph, 1.2);

  ctx.beginPath(); ctx.arc(0, 0, R_AMPH * puls, 0, Math.PI*2); ctx.fill();
  glowOff();
  ctx.strokeStyle = onLand ? T.hole : T.amphHi; ctx.lineWidth = .1;

}
function drawSuperItem(it) {
  const left = it.ttl - it.age, ending = left < 2.5;
  const pop = Math.min(1, it.age * 3), gold = T.rainbow ? '#ffd23f' : T.ball;
  ctx.save(); ctx.translate(it.x, it.y + Math.sin(time * 4) * .12); ctx.scale(pop, pop);
  // rayons de lumière tournants
  ctx.save(); ctx.rotate(time * .8);
  for (let k = 0; k < 12; k++) {
    ctx.rotate(Math.PI / 6);
    ctx.fillStyle = T.rainbow ? `hsla(${(k * 30 + time * 120) % 360},100%,65%,0.28)` : 'rgba(11,24,56,0.18)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2.6, -.22); ctx.lineTo(2.6, .22); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // halo
  const pulse = 1.2 + Math.sin(time * 6) * .1;
  glowOn(gold, 2.4);
  ctx.fillStyle = T.itemBg; ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = .2;
  for (let k = 0; k < 8; k++) {
    ctx.strokeStyle = T.rainbow ? `hsl(${(k * 45 + time * 360) % 360},100%,62%)` : gold;
    ctx.beginPath(); ctx.arc(0, 0, pulse, k * Math.PI / 4, (k + 1) * Math.PI / 4 + .02); ctx.stroke();
  }
  glowOff();
  // étincelles en orbite
  for (let k = 0; k < 5; k++) {
    const a = time * 2.2 + k * Math.PI * 2 / 5, r = pulse + .45, tw = .1 + Math.abs(Math.sin(time * 9 + k)) * .12;
    ctx.fillStyle = T.rainbow ? '#ffffff' : gold;
    ctx.save(); ctx.translate(Math.cos(a) * r, Math.sin(a) * r); ctx.rotate(time * 3);
    ctx.fillRect(-tw, -.03, tw * 2, .06); ctx.fillRect(-.03, -tw, .06, tw * 2); ctx.restore();
  }
  if (!(ending && Math.floor(left * 4) % 2 === 0)) {
    // casque doré + couronne
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.arc(0, .22, .52, Math.PI, 0); ctx.lineTo(.52, .4); ctx.lineTo(-.52, .4); ctx.closePath(); ctx.fill();
    ctx.fillRect(-.64, .36, 1.28, .14);
    ctx.fillStyle = T.itemInk; ctx.fillRect(-.34, .08, .68, .15);
    ctx.fillStyle = gold;
    ctx.beginPath(); ctx.moveTo(-.4, -.24); ctx.lineTo(-.4, -.62); ctx.lineTo(-.2, -.4); ctx.lineTo(0, -.72); ctx.lineTo(.2, -.4); ctx.lineTo(.4, -.62); ctx.lineTo(.4, -.24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = T.rainbow ? '#ff4d8d' : T.itemInk; ctx.beginPath(); ctx.arc(0, -.38, .08, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawItem(it) {
  if (it.type === 'sup') { drawSuperItem(it); return; }
  const color = T.items[it.type], left = it.ttl - it.age, ending = left < 2.5;
  const pop = Math.min(1, it.age * 4), bob = it.vx || it.vy ? 0 : Math.sin(time * 3 + it.x) * 0.15;
  const r = 0.95 * pop;
  ctx.save(); ctx.translate(it.x, it.y + bob);
  glowOn(color, 1.2);
  ctx.fillStyle = T.itemBg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = 0.16;
  if (it.type === 'inv' && T.rainbow) {
    for (let k = 0; k < 6; k++) {
      ctx.strokeStyle = `hsl(${(k * 60 + time * 200) % 360},100%,65%)`;
      ctx.beginPath(); ctx.arc(0, 0, r, k * Math.PI/3, (k + 1) * Math.PI/3 + 0.02); ctx.stroke();
    }
  } else { ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke(); }
  glowOff();
  // 6 points autour : clignotent, puis se figent quand le bonus va disparaître
  for (let k = 0; k < 6; k++) {
    if (!ending && (Math.floor(time * 4) + k) % 2) continue;
    const a = k * Math.PI / 3 + (ending ? 0 : time * .6);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(Math.cos(a) * (r + .32), Math.sin(a) * (r + .32), .09, 0, Math.PI*2); ctx.fill();
  }
  // le cœur du bonus clignote 2 fois par seconde avant de disparaître
  if (ending && Math.floor(left * 4) % 2 === 0) { ctx.restore(); return; }
  ctx.scale(pop, pop);
  ctx.fillStyle = color;
  ctx.beginPath();
  if (it.type === 'spd') {
    ctx.moveTo(.12,-.58); ctx.lineTo(-.32,.06); ctx.lineTo(-.02,.06); ctx.lineTo(-.14,.58); ctx.lineTo(.32,-.08); ctx.lineTo(.02,-.08); ctx.closePath(); ctx.fill();
  } else if (it.type === 'inv') {
    ctx.fillStyle = T.rainbow ? '#fff4c0' : color;
    ctx.arc(0, .14, .46, Math.PI, 0); ctx.lineTo(.46, .3); ctx.lineTo(-.46, .3); ctx.closePath(); ctx.fill();
    ctx.fillRect(-.56, .26, 1.12, .12);
    ctx.fillStyle = T.itemInk; ctx.fillRect(-.3, -.02, .6, .14);
    ctx.fillStyle = T.rainbow ? '#ffd23f' : T.itemInk; ctx.fillRect(-.05, -.32, .1, .22);
  } else if (it.type === 'life') {
    ctx.moveTo(0,.48); ctx.bezierCurveTo(-.62,.05,-.4,-.55,0,-.22); ctx.bezierCurveTo(.4,-.55,.62,.05,0,.48); ctx.fill();
  } else {
    ctx.arc(0, 0, .2, 0, Math.PI*2); ctx.fill();
    for (let k = 0; k < 4; k++) {
      ctx.save(); ctx.rotate(k * Math.PI / 2 + Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(.32, -.12); ctx.lineTo(.56, 0); ctx.lineTo(.32, .12); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = color; ctx.lineWidth = .06; ctx.beginPath(); ctx.arc(0, 0, .3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (slow > 0) { slow -= dt; dt *= 0.3; }
  if (superFlash > 0) superFlash = Math.max(0, superFlash - dt * 1.6);
  if (scale > 0 && cv.width) { update(dt); render(); }
  requestAnimationFrame(frame);
}

/* ---------- HUD et écrans ---------- */
function hud() {
  $('dlab').textContent = S.test ? 'MODE' : S.phase === 'title' ? 'NIV' : 'NIV ' + DIFFS[S.diff].short;
  if (S.test) { $('lvl').textContent = 'TEST'; }
  if (!S.test) $('lvl').innerHTML = `${pad2(S.level)}<small>/${MAX_LEVEL}</small>`;
  $('score').textContent = fmt(S.score);
  const max = Math.max(3, S.lives);
  $('lives').innerHTML = Array.from({ length: max }, (_, i) => `<i class="${i < S.lives ? '' : 'off'}"></i>`).join('');
  const goal = Math.round(DIFFS[S.diff].goal * 100);
  const p = Math.min(100, Math.floor(S.filled / S.interior * 100));
  $('bar').style.width = p + '%';
  $('goal').style.left = goal + '%';
  $('pct').innerHTML = `${p}%<small>/${goal}</small>`;
}
let onGo = null;
function showOverlay(html, cb) {
  ov.innerHTML = `<div class="card">${html}</div>`; ov.hidden = false; onGo = cb;
  const b = $('go'); if (b) { b.addEventListener('click', () => { ensureAudio(); go(); }); setTimeout(() => b.focus({ preventScroll: true }), 30); }
}
function go() { const f = onGo; onGo = null; if (f) f(); }
function hideOverlay() { ov.hidden = true; ov.innerHTML = ''; onGo = null; }
function infoRows(done) {

      <div class="total"><span>Score</span><span>${fmt(S.score)}</span></div>
    </div>`;
}
function newcomers() {
  if (S.test) return '<p class="keys">Vies infinies, pas d\'objectif. Utilise les boutons sous le terrain pour faire apparaître bonus et ennemis.</p>';
  if (S.readyMode !== 'start') return '';
  const now = S.comp, prev = S.level > 1 ? comp(S.level - 1, S.diff) : { out: 0, inn: 0, perf: 0, amph: 0, eat: 0 };
  let html = '';
  for (const k of ['out', 'inn', 'perf', 'amph', 'eat']) if (now[k] > 0 && prev[k] === 0) html += `<p class="new"><b>NOUVEAU · ${INTRO[k][0]}</b><br>${INTRO[k][1]}</p>`;
  if (now.bonus) html += `<p class="keys">Niveau bonus : des bonus apparaissent dès 10 % conquis.${now.mobile ? ' Ils se déplacent.' : ''}</p>`;

}

  S.readyMode = mode; S.phase = 'ready'; S.readyT = 5;

  showOverlay(`
    <h2><span>${mode === 'restart' ? 'ON REPART' : S.test ? 'BAC À SABLE' : 'NIVEAU'}</span>${S.test ? 'MODE TEST' : `NIVEAU ${pad2(S.level)} / ${MAX_LEVEL}`}</h2>

function showClear() {
  S.phase = 'clear';
  const D = DIFFS[S.diff], pct = S.filled / S.interior;

    <div class="stepper"><span class="k">NIVEAU DE DÉPART</span>
      <button id="lm" aria-label="Niveau précédent" ${menuLevel <= 1 ? 'disabled' : ''}>−</button>
      <span class="v" id="lv">${pad2(menuLevel)}</span>
      <button id="lp" aria-label="Niveau suivant" ${menuLevel >= maxL ? 'disabled' : ''}>+</button>
    </div>
    <button class="btn" id="go">NOUVEAU JEU</button>
    ${sv ? `<button class="btn ghost" id="cont">CONTINUER · NIVEAU ${pad2(sv.L)} · ${DIFFS[sv.d].name.toUpperCase()}</button>` : ''}
    <button class="btn ghost" id="tmode">MODE TEST · ESSAYER LES BONUS</button>
    ${best ? `<div class="rows"><div><span>Record ${DIFFS[menuDiff].name}</span><span>${fmt(best)}</span></div></div>` : ''}
    <details><summary>COMMENT JOUER</summary>
      <ul>
        <li>Pars de ton terrain et trace un fil dans la zone à conquérir. En revenant sur ton terrain, toute la zone sans boule ni perforateur est conquise.</li>
        <li><b>Boule</b> : si elle touche ton fil, une onde de choc le remonte et te fige.</li>
        <li><b>Perforateur</b> : plus rapide, il transperce ton fil au lieu de rebondir, et son onde est foudroyante.</li>
        <li><b>Gardien</b> : il patrouille sur ton terrain.</li>
        <li><b>Amphibie</b> : un trou noir qui passe partout et t'aspire si tu entres dans son cercle.</li>
        <li><b>Rongeur</b> (niveaux avancés) : lent, il grignote ton terrain à chaque contact.</li>
        <li><b>Bonus</b> (un niveau sur deux, dès 10 %) : casque (les ennemis n'ont plus d'effet sur toi ni sur ton fil), vitesse (sur ton terrain), vie, territoire. Et, très rarement, le <b>Super Casque</b> : ton fil devient un mur et tu dégommes tout ce que tu touches.</li>
        <li>Glisse pour diriger, tape pour t'arrêter sur ton terrain. Pause avec le bouton en haut.</li>
      </ul>
    </details>`, () => newGame(menuDiff, menuLevel));
  ov.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { menuDiff = +b.dataset.d; store.set('diff', menuDiff); menuLevel = 1; titleScreen(); }));
  const lm = $('lm'), lp = $('lp');
  lm && lm.addEventListener('click', () => { menuLevel = Math.max(1, menuLevel - 1); titleScreen(); });
  lp && lp.addEventListener('click', () => { menuLevel = Math.min(maxL, menuLevel + 1); titleScreen(); });
  const c = $('cont'); c && c.addEventListener('click', () => { onGo = null; continueGame(); });
  $('tmode').addEventListener('click', () => { onGo = null; ensureAudio(); S.test = true; S.diff = menuDiff; S.score = 0; S.lives = 3; setupLevel(1); });
  S.diff = menuDiff; S.level = menuLevel; S.score = 0; S.lives = 3;
  hud(); powersHud();
}
function startDemo() {
  resetGrid();
  for (let y = 40; y < ROWS - B; y++) for (let x = B; x < 22; x++) grid[at(x,y)] = 1;
  for (let y = B; y < 14; y++) for (let x = 34; x < COLS - B; x++) grid[at(x,y)] = 1;
  foes = [makeFoe('out', .8), makeFoe('perf', .8), makeFoe('amph', .8)];
  foes[2].y = 30;
  items = []; trail = []; erased = []; wave = null; P = null; power.inv = 0; power.spd = 0; power.sup = 0;
  S.filled = 0; reveal = null; drawBoard();
}
function togglePause() {
  if (S.phase === 'play') {
    S.pausedFrom = 'play'; S.phase = 'pause';
    showOverlay(`<h2><span>NIVEAU ${pad2(S.level)} / ${MAX_LEVEL}</span>PAUSE</h2>${infoRows(true)}<p class="keys">Tape n'importe où pour reprendre.</p><button class="btn" id="go">REPRENDRE</button>`, resume);
  } else if (S.phase === 'pause') resume();
}
function resume() { hideOverlay(); S.phase = 'play'; last = performance.now(); }

/* ---------- Mode test ---------- */
function testItem(type) {
  if (!S.test || !P || (S.phase !== 'play' && S.phase !== 'ready' && S.phase !== 'pause')) return;
  const medium = ITEM[type].medium, pp = playerPos(), cands = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    const v = grid[at(x, y)];
    if (medium === 'sea' ? v !== 0 : v !== 1) continue;
    const d = Math.hypot(x + .5 - pp.x, y + .5 - pp.y);
    if (d < 3) continue;
    cands.push([d, x, y]);
  }
  if (!cands.length) return;
  cands.sort((a, b) => a[0] - b[0]);
  const pick = cands[(Math.random() * Math.min(12, cands.length)) | 0];
  items.push({ type, x: pick[1] + .5, y: pick[2] + .5, vx: 0, vy: 0, age: 0, ttl: 30, done: false });
  sfx.appear();
}
function testFoe(kind) {
  if (!S.test || !P) return;
  const e = makeFoe(kind, DIFFS[S.diff].sp);
  const want = kind === 'inn' ? 1 : kind === 'amph' ? -1 : 0;
  if (want >= 0) {
    const pp = playerPos(), cands = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (grid[at(x, y)] !== want) continue;
      if (Math.hypot(x + .5 - pp.x, y + .5 - pp.y) < 10) continue;
      cands.push([x, y]);
    }
    if (!cands.length) return;
    const [x, y] = cands[(Math.random() * cands.length) | 0];
    e.x = x + .5; e.y = y + .5;
  } else { e.x = COLS / 2; e.y = ROWS * .7; }
  foes.push(e);
  rings.push({ x: e.x, y: e.y, r: 0, max: 2.5, age: 0, color: T.shock });
  sfx.appear();
}
document.querySelectorAll('#testbar [data-item]').forEach(b => b.addEventListener('click', () => { ensureAudio(); testItem(b.dataset.item); }));
document.querySelectorAll('#testbar [data-foe]').forEach(b => b.addEventListener('click', () => { ensureAudio(); testFoe(b.dataset.foe); }));
$('tclear').addEventListener('click', () => { if (S.test) { for (const e of foes) burst(e.x, e.y, T.shock, 10, 6); foes = []; } });
$('treset').addEventListener('click', () => { if (S.test) { S.score = 0; setupLevel(1); } });
$('tquit').addEventListener('click', () => { if (S.test) titleScreen(); });

/* ---------- Contrôles ---------- */
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  z:'up', w:'up', s:'down', q:'left', a:'left', d:'right', ' ':'stop' };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Enter' && onGo && !ov.hidden) { e.preventDefault(); ensureAudio(); go(); return; }
  if (k === 'p' || k === 'Escape') { e.preventDefault(); togglePause(); return; }
  if (KEYS[k]) { e.preventDefault(); setDir(KEYS[k]); }
});
let touch = null;
cv.addEventListener('pointerdown', e => { touch = { x: e.clientX, y: e.clientY, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} ensureAudio(); });
cv.addEventListener('pointermove', e => {
  if (!touch) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  if (Math.hypot(dx, dy) > 18) {
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touch = { x: e.clientX, y: e.clientY, moved: true };
  }
});
cv.addEventListener('pointerup', () => { if (touch && !touch.moved) setDir('stop'); touch = null; });
cv.addEventListener('pointercancel', () => { touch = null; });
ov.addEventListener('pointerup', e => {
  if (e.target.closest('button, details')) return;
  if (S.phase === 'pause') { ensureAudio(); resume(); }
  else if (S.phase === 'ready') { ensureAudio(); go(); }
});
$('pz').addEventListener('click', togglePause);
const snd = $('snd');
const sndLabel = () => snd.textContent = 'SON : ' + (muted ? 'NON' : 'OUI');
sndLabel();
snd.addEventListener('click', () => { muted = !muted; sndLabel(); ensureAudio(); store.set('mute', muted); });
const scr = $('scr');
const scrLabel = () => scr.textContent = 'ÉCRAN : ' + T.label;
scrLabel();
scr.addEventListener('click', () => {
  const key = T === THEMES.color ? 'myx3' : 'color';
  T = THEMES[key]; store.set('theme', key); scrLabel();
  for (const r of rings) r.color = T.items.terr;
  drawBg(); drawBoard();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase === 'play') togglePause(); });

titleScreen();
requestAnimationFrame(frame);
})();
</script>
